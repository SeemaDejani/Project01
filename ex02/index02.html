<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links & Images</title>
</head>
<body>
    <h1>My Profile Page</h1>
    <img src="assets/profile.jpg" alt="Profile pic of the user" width="150">
    <p> | 
        <a href="https://github.com/your-profile" target="_blank" rel="noopener noreferrer">GitHub</a>
    </p>
    <p>
        <a href="#contact">jump to Contact</a>
    </p>
    <div style="height: 500px;"></div>
    <div id="contact">
        <p> Contact email: <a href="mailto:myemail@example.com">myemail@example.com</a></p>
    </div>
</body>
</html>
